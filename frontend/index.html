<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts import -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="contact-container">
        <h2>تواصل معنا</h2>
        <p class="subtitle">يسعدنا استقبال استفساراتك ورسائلك في أي وقت.</p>

        <!-- Main Contact Form -->
        <form id="contactForm">
            <div class="form-group">
                <label for="name">الاسم الكامل</label>
                <input type="text" id="name" name="name" placeholder="أدخل اسمك" required>
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" name="email" placeholder="example@domain.com" required>
            </div>

            <div class="form-group">
                <label for="subject">الموضوع</label>
                <input type="text" id="subject" name="subject" placeholder="عنوان الرسالة" required>
            </div>

            <div class="form-group">
                <label for="message">الرسالة</label>
                <textarea id="message" name="message" rows="4" placeholder="اكتب رسالتك هنا..." required></textarea>
            </div>

            <!-- Anti-spam Honeypot field (hidden from real users) -->
            <div class="honeypot-field">
                <input type="text" id="website" name="website" autocomplete="off">
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn">
                <span class="btn-text">إرسال الرسالة</span>
                <span class="spinner" id="spinner" style="display: none;"></span>
            </button>
        </form>

        <!-- Response Status Notification Box -->
        <div id="responseMessage" class="response-message"></div>

        <!-- Footer Section (Fixed class typo & closed b tag) -->
        <footer class="footer">
            Built with ☁️ <b>Ali Soliman</b> - DEPI #3 Project
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
